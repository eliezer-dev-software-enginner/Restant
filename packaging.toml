# Only application-specific data; implementation is shared across all clients.
schema_version = 1

[app]
icon_linux = "src/main/resources/assets/Logo.png"

[build]
mode = "fat-jar"
tasks = ["clean", "shadowJar"]
jar = "build/libs/*.jar"

[javafx]
version = "25.0.1"

[runtime]
modules = ["javafx.controls", "java.sql", "jdk.zipfs", "java.logging", "java.xml", "jdk.charsets"]
exclude_natives = ["jfxwebkit.dll"]

[windows]
upgrade_uuid = "ea604bbe-db92-5a18-a554-2efcb9a28fab"
per_user = true

[linux]
package_name = "everest"
menu_group = "Office"
